[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-node-supervisor"
version = "0.2.0"
description = "Local planning and orchestration for Raspberry Pi capture and sensor nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
sensor = [
  "pyserial>=3.5",
]
remote = [
  "paramiko>=3.4",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
pi-node-supervisor = "pi_node_supervisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_node_supervisor"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
