[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capture-node"
version = "0.1.0"
description = "Reusable still-image capture, distribution, headless, and web runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
raspberry-pi = [
  "picamera2>=0.3.20",
]
sftp = [
  "paramiko>=4.0,<6.0",
]

[project.scripts]
capture-node = "capture_node.headless.cli:main"
capture-node-web = "capture_node.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capture_node"]
exclude = ["src/capture_node/web/frontend/**"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "covers(*requirements): SRS requirement IDs covered by the test",
  "hardware: requires Raspberry Pi 5 and a CSI camera",
]
