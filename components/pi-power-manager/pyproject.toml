[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-power-manager"
version = "0.1.0"
description = "Fail-safe RTC wake alarm power scheduling for Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "pi-power-manager contributors" }]
dependencies = []

[project.scripts]
pi-power-manager = "pi_power_manager.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

